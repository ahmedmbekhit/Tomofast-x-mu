[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomofast_x_mu"
version = "0.1.0"
description = "QDM 3D Inversion pipeline wrapping Tomofast-x"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "matplotlib",
]

[project.scripts]
tomofast_x_mu = "tomofast_x_mu.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
